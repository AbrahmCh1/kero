[package]
name = "kero"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.17"
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard"] }
fend-core = "1.5.9"
global-hotkey = "0.9.0"
notify = "8.2.1"
nucleo-matcher = "0.3.1"
parking_lot = "0.13.0"
raw-window-handle = "0.6"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_ProcessStatus", "Win32_System_Shutdown", "Win32_UI_HiDpi", "Win32_Storage_FileSystem", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Power", "Win32_Security", "Win32_System_SystemServices", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
